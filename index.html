<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisis Hasil Praktikum - Kesetimbangan Kimia</title>
</head>
<body style="margin: 0; padding: 0; background-color: transparent;">

<div style="
  font-family: 'Segoe UI', Arial, sans-serif;
  max-width: 600px;
  margin: 12px auto;
  padding: 24px;
  background: linear-gradient(145deg, #ffffff, #f0f7ff);
  border: 1px solid #d5e7ff;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(35, 100, 180, 0.12);
  color: #19365b;
  box-sizing: border-box;
">

  <!-- HEADER -->
  <div style="
    background: linear-gradient(135deg, #1769c2, #63a7f5);
    padding: 18px 16px;
    border-radius: 15px;
    margin-bottom: 20px;
    color: white;
    text-align: center;
  ">
    <div style="font-size: 28px; margin-bottom: 4px;">🧠</div>
    <div style="font-size: 18px; font-weight: 800; letter-spacing: 0.5px;">
      ANALISIS HASIL PRAKTIKUM
    </div>
    <div style="font-size: 12px; margin-top: 4px; opacity: 0.95;">
      Jawablah Pertanyaan Analisis Berdasarkan Hasil Praktikum Virtual Lab
    </div>
  </div>

  <!-- KODE KELOMPOK -->
  <div style="margin-bottom: 20px;">
    <label for="kode" style="
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #234d7d;
    ">
      🔑 Pilih Kode Kelompok
    </label>
    <select id="kode" required style="
      width: 100%;
      padding: 12px;
      border: 1px solid #bfd8f6;
      border-radius: 10px;
      background: #ffffff;
      color: #234d7d;
      font-size: 14px;
      font-weight: 600;
      outline-color: #438fe5;
      box-sizing: border-box;
    ">
      <option value="">-- Pilih Kode Kelompok --</option>
      <option value="KLP01">KLP01 — Kelompok 1</option>
      <option value="KLP02">KLP02 — Kelompok 2</option>
      <option value="KLP03">KLP03 — Kelompok 3</option>
      <option value="KLP04">KLP04 — Kelompok 4</option>
      <option value="KLP05">KLP05 — Kelompok 5</option>
      <option value="KLP06">KLP06 — Kelompok 6</option>
      <option value="KLP07">KLP07 — Kelompok 7</option>
      <option value="KLP08">KLP08 — Kelompok 8</option>
      <option value="KLP09">KLP09 — Kelompok 9</option>
      <option value="KLP10">KLP10 — Kelompok 10</option>
    </select>
  </div>

  <!-- SOAL 1 -->
  <div style="margin-bottom: 18px;">
    <label for="soal1" style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #234d7d; line-height: 1.5;">
      1. [👁️ Makroskopik] Berdasarkan hasil pengamatan, bagaimana perubahan warna dan konsentrasi spesies [Co(H₂O)₆]²⁺, Cl⁻, dan [CoCl₄]²⁻ setelah penambahan HCl?
    </label>
    <textarea id="soal1" required placeholder="Tuliskan jawaban kelompokmu di sini..." style="
      width: 100%; height: 90px; padding: 12px; border: 1px solid #bfd8f6; border-radius: 10px;
      background: #ffffff; color: #19365b; font-family: inherit; font-size: 13px; line-height: 1.6;
      resize: vertical; box-sizing: border-box; outline-color: #438fe5;
    "></textarea>
  </div>

  <!-- SOAL 2 -->
  <div style="margin-bottom: 18px;">
    <label for="soal2" style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #234d7d; line-height: 1.5;">
      2. [📝 Simbolik] Tuliskan persamaan reaksi kesetimbangan Kobalt(II) yang terjadi. Kemudian, tentukan arah pergeseran kesetimbangan berdasarkan hasil praktikum dan jelaskan alasanmu berdasarkan Asas Le Chatelier!
    </label>
    <textarea id="soal2" required placeholder="Tuliskan reaksi dan penjelasan di sini..." style="
      width: 100%; height: 100px; padding: 12px; border: 1px solid #bfd8f6; border-radius: 10px;
      background: #ffffff; color: #19365b; font-family: inherit; font-size: 13px; line-height: 1.6;
      resize: vertical; box-sizing: border-box; outline-color: #438fe5;
    "></textarea>
  </div>

  <!-- SOAL 3 -->
  <div style="margin-bottom: 18px;">
    <label for="soal3" style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #234d7d; line-height: 1.5;">
      3. [🔬 Submikroskopik] Jelaskan pada tingkat partikel mengapa penambahan HCl menyebabkan jumlah kompleks [CoCl₄]²⁻ bertambah!
      <span style="display: block; font-size: 11px; color: #5a7b9e; font-weight: normal; margin-top: 4px;">
        💡 (Petunjuk: Amati gambar visualisasi partikel di slide, lalu gunakan istilah <b>konsentrasi ion Cl⁻</b>, <b>tumbukan</b>, dan <b>pergeseran kesetimbangan</b> dalam penjelasanmu).
      </span>
    </label>
    <textarea id="soal3" required placeholder="Jelaskan proses tingkat partikel di sini..." style="
      width: 100%; height: 110px; padding: 12px; border: 1px solid #bfd8f6; border-radius: 10px;
      background: #ffffff; color: #19365b; font-family: inherit; font-size: 13px; line-height: 1.6;
      resize: vertical; box-sizing: border-box; outline-color: #438fe5;
    "></textarea>
  </div>

  <!-- SOAL 4 -->
  <div style="margin-bottom: 18px;">
    <label for="soal4" style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #234d7d; line-height: 1.5;">
      4. [📝 Simbolik] Tuliskan persamaan reaksi yang terjadi ketika AgNO₃ ditambahkan ke dalam sistem kesetimbangan Kobalt(II). Jelaskan bagaimana terbentuknya endapan memengaruhi arah pergeseran kesetimbangan!
    </label>
    <textarea id="soal4" required placeholder="Tuliskan persamaan reaksi dan pengaruh endapan di sini..." style="
      width: 100%; height: 100px; padding: 12px; border: 1px solid #bfd8f6; border-radius: 10px;
      background: #ffffff; color: #19365b; font-family: inherit; font-size: 13px; line-height: 1.6;
      resize: vertical; box-sizing: border-box; outline-color: #438fe5;
    "></textarea>
  </div>

  <!-- SOAL 5 -->
  <div style="margin-bottom: 22px;">
    <label for="soal5" style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #234d7d; line-height: 1.5;">
      5. [🦷 Penerapan Konsep] Berdasarkan prinsip kesetimbangan yang telah kamu buktikan di atas, jelaskan kembali fenomena pada kasus karies gigi! Bagaimana peningkatan konsentrasi ion H⁺ (akibat sisa makanan) dapat memengaruhi pelarutan enamel gigi?
    </label>
    <textarea id="soal5" required placeholder="Jelaskan keterkaitan ion H+ dengan pelarutan enamel gigi di sini..." style="
      width: 100%; height: 110px; padding: 12px; border: 1px solid #bfd8f6; border-radius: 10px;
      background: #ffffff; color: #19365b; font-family: inherit; font-size: 13px; line-height: 1.6;
      resize: vertical; box-sizing: border-box; outline-color: #438fe5;
    "></textarea>
  </div>

  <!-- TOMBOL SIMPAN -->
  <button type="button" onclick="kirimAnalisis()" style="
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #1769c2, #3989e8);
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(23, 105, 194, 0.22);
  ">
    🚀 Kirim Jawaban Analisis
  </button>

  <div id="st" role="status" aria-live="polite" style="
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
    font-weight: 600;
    line-height: 1.6;
  "></div>

</div>

<!-- SCRIPT PENGIRIM DATA -->
<script>
  // Tempelkan URL Web App Apps Script (/exec) kamu di sini
  const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxLrc6TSsHLwwdLc8Ve4scnhek_1HhtAHjVVUXdvpuqk-hrtXOiyYJuwxzXcVZLa0Ho3w/exec";

  function kirimAnalisis() {
    const kode = document.getElementById("kode").value.trim();
    const st = document.getElementById("st");

    if (!kode) {
      st.innerText = "⚠️ Pilih Kode Kelompok terlebih dahulu!";
      st.style.color = "#d9534f";
      return;
    }

    // Merangkum seluruh jawaban Soal 1 - Soal 5 menjadi teks yang rapi
    const hasilAnalisis = `
[SOAL 1 - Makroskopik]
${document.getElementById("soal1").value}

[SOAL 2 - Simbolik]
${document.getElementById("soal2").value}

[SOAL 3 - Submikroskopik]
${document.getElementById("soal3").value}

[SOAL 4 - Simbolik AgNO3]
${document.getElementById("soal4").value}

[SOAL 5 - Karies Gigi]
${document.getElementById("soal5").value}
    `.trim();

    st.innerText = "⏳ Sedang mengirim jawaban analisis...";
    st.style.color = "#1769c2";

    fetch(URL_WEB_APP, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kode: kode,
        // Properti ini dikirim ke variabel fase5 (atau ganti sesuai kolom target di Kode.gs)
        fase5: hasilAnalisis
      })
    })
    .then(() => {
      st.innerText = "✅ Jawaban Analisis Kelompok " + kode + " Berhasil Terkirim!";
      st.style.color = "#28a745";
    })
    .catch(error => {
      st.innerText = "❌ Gagal mengirim data. Silakan coba lagi.";
      st.style.color = "#d9534f";
    });
  }
</script>

</body>
</html>
